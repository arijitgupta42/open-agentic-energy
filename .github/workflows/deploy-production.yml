name: Deploy production

# Deploys the three sites to Cloudflare Workers from the `production` branch, which holds
# the production origins (see "Branches" in docs/deployment.md). It runs on each push to
# `production` and by hand from the Actions tab. Run from any other branch it stops, so
# `dev`, which holds local origins, can never be deployed.
#
# It needs two repository secrets (Settings > Secrets and variables > Actions):
#   CLOUDFLARE_API_TOKEN   a token with the "Edit Cloudflare Workers" template
#   CLOUDFLARE_ACCOUNT_ID  the account that owns the three Workers
on:
  push:
    branches: [production]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/production'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Cloudflare secrets are set
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Add the CLOUDFLARE_API_TOKEN repository secret."; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Add the CLOUDFLARE_ACCOUNT_ID repository secret."; exit 1; }
      - name: Generated files, runtime copies and conformance
        run: npm run check
      - name: Production origins are in place
        run: node scripts/check-conformance.mjs --production
      - name: Tests
        run: npm test
      - name: Deploy the three sites
        run: |
          npx wrangler@4 deploy --config deploy/cloudflare/utility.jsonc
          npx wrangler@4 deploy --config deploy/cloudflare/installer.jsonc
          npx wrangler@4 deploy --config deploy/cloudflare/grants.jsonc
      - name: Check the hosted sites
        run: npm run conformance:live -- --env production
